<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeToken Multi-Model Gateway</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [models, setModels] = useState({});
            const [modelInput, setModelInput] = useState('');
            const [isStarting, setIsStarting] = useState(false);
            const [error, setError] = useState(null);

            const fetchModels = async () => {
                try {
                    const res = await fetch('/api/models');
                    const data = await res.json();
                    setModels(data);
                } catch (err) {
                    console.error("Failed to fetch models", err);
                }
            };

            useEffect(() => {
                fetchModels();
                const interval = setInterval(fetchModels, 2000);
                return () => clearInterval(interval);
            }, []);

            const handleStart = async () => {
                if (!modelInput.trim()) {
                    setError('Please enter a model name');
                    return;
                }
                
                setError(null);
                setIsStarting(true);
                try {
                    const res = await fetch('/api/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model: modelInput.trim() })
                    });
                    
                    if (res.ok) {
                        setModelInput('');
                        fetchModels();
                    } else {
                        const data = await res.json();
                        setError(data.detail || 'Failed to start model');
                    }
                } catch (err) {
                    setError('Network request failed');
                } finally {
                    setIsStarting(false);
                }
            };

            const handleStop = async (modelName) => {
                if (!confirm(`Are you sure you want to stop ${modelName}?`)) return;
                
                try {
                    await fetch('/api/stop', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model: modelName })
                    });
                    fetchModels();
                } catch (err) {
                    console.error("Failed to stop model", err);
                }
            };

            return (
                <div className="max-w-4xl mx-auto">
                    <h1 className="text-3xl font-bold mb-8 flex items-center gap-3">
                        <svg className="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        FreeToken API Gateway
                    </h1>
                    
                    {/* Start New Model */}
                    <div className="bg-gray-800 p-6 rounded-lg mb-8 shadow-xl border border-gray-700">
                        <h2 className="text-xl font-semibold mb-4">Start a Model</h2>
                        <div className="flex gap-4">
                            <input 
                                type="text" 
                                value={modelInput}
                                onChange={(e) => setModelInput(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && handleStart()}
                                placeholder="e.g. Qwen/Qwen3.6-35B-A3B" 
                                className="flex-1 bg-gray-900 border border-gray-600 text-white px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                            <button 
                                onClick={handleStart} 
                                disabled={isStarting}
                                className={`px-6 py-2 rounded font-semibold transition ${isStarting ? 'bg-blue-800 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500'}`}
                            >
                                {isStarting ? 'Starting...' : 'Start'}
                            </button>
                        </div>
                        {error && <p className="text-red-400 mt-2 text-sm">{error}</p>}
                        <p className="text-sm text-gray-400 mt-2">Enter a Hugging Face Repo ID or a local absolute path.</p>
                    </div>

                    {/* Running Models */}
                    <div className="bg-gray-800 p-6 rounded-lg shadow-xl border border-gray-700">
                        <h2 className="text-xl font-semibold mb-4 flex justify-between items-center">
                            Running Models
                            <span className="text-sm bg-blue-900 text-blue-300 px-3 py-1 rounded-full">
                                {Object.keys(models).length} Active
                            </span>
                        </h2>
                        
                        <div className="space-y-4">
                            {Object.keys(models).length === 0 ? (
                                <p className="text-gray-400 italic bg-gray-900 p-4 rounded text-center border border-dashed border-gray-700">
                                    No models currently running.
                                </p>
                            ) : (
                                Object.entries(models).map(([name, info]) => (
                                    <div key={name} className="bg-gray-900 border border-gray-700 p-4 rounded-lg flex justify-between items-center hover:border-gray-500 transition">
                                        <div className="flex items-center gap-4">
                                            <div className={`w-3 h-3 rounded-full ${info.status === 'crashed' || info.status === 'failed' ? 'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]' : (info.status === 'starting' ? 'bg-yellow-500 animate-pulse' : (info.status === 'downloading' ? 'bg-blue-500 animate-bounce' : 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]'))}`}></div>
                                            <div>
                                                <h3 className="font-bold text-lg">{name}</h3>
                                                <p className="text-sm text-gray-400 flex items-center gap-2">
                                                    <span className="bg-gray-800 px-2 py-0.5 rounded text-xs border border-gray-600">Port: {info.port}</span>
                                                    <span className="capitalize text-gray-300 font-medium">{info.status}</span>
                                                    <span className="text-gray-500">|</span>
                                                    <span className="text-blue-300 font-mono text-xs bg-blue-900/30 px-2 py-0.5 rounded">{info.progress}</span>
                                                </p>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => handleStop(name)} 
                                            className="bg-red-600 hover:bg-red-500 px-4 py-2 rounded text-sm font-semibold transition flex items-center gap-2"
                                        >
                                            Stop
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
